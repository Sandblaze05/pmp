<div class="fixed top-24 right-4 z-999 flex w-[calc(100%-2rem)] max-w-sm flex-col gap-3 sm:right-6 sm:w-full lg:right-10">
    @for (toast of toastService.toasts(); track toast.id) {
    <div 
        role="alert"
        animate.enter="toast-enter"
        animate.exit="toast-leave"
        class="flex items-center gap-3 rounded-xl border bg-[#171717]/95 p-4 text-sm text-[#fefefe] shadow-2xl shadow-black/50 backdrop-blur-sm"
        [class.border-red-400/60]="toast.type === 'error'"
        [class.border-amber-300/60]="toast.type === 'warning'"
        [class.border-sky-300/60]="toast.type === 'info'"
    >
        <span 
            class=" size-2 shrink-0 rounded-full"
            [class.bg-red-400]="toast.type === 'error'"
            [class.bg-amber-300]="toast.type === 'warning'"
            [class.bg-sky-300]="toast.type === 'info'"
            aria-hidden="true"
        >
        </span>
        
        <span class="min-w-0 flex-1 leading-5">{{ toast.message }}</span>

        <button 
            type="button"
            class="shrink-0 rounded-md p-1 text-[#fefefe]/60 transition-colors hover:bg-[#fefefe]/10 hover:text-[#fefefe] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#fefefe]"
            (click)="toastService.dismiss(toast.id)" aria-label="Dismiss notification"
        >
            <svg lucideX class="size-4"></svg>
        </button>
    </div>
    }
</div>
